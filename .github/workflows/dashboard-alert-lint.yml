name: Dashboard and Alert Lint

on:
  push:
    branches: [main]
    paths:
      - "docs/dashboards/**"
      - "docs/alerts/**"
      - "runbooks/**"
      - "Makefile"
      - "scripts/check-runbook-anchors.py"
      - "scripts/__tests__/check-runbook-anchors.test.sh"
      - ".github/workflows/dashboard-alert-lint.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/dashboards/**"
      - "docs/alerts/**"
      - "runbooks/**"
      - "Makefile"
      - "scripts/check-runbook-anchors.py"
      - "scripts/__tests__/check-runbook-anchors.test.sh"
      - ".github/workflows/dashboard-alert-lint.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint dashboards
        run: make dashboard-lint

      - name: Lint alerts
        run: make alert-lint

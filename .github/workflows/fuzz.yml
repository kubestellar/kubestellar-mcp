name: Fuzz

on:
  schedule:
    # Weekly, Sunday 07:00 UTC — offset from build-test.yml's 06:00 UTC daily
    # so the two jobs never collide on the shared runner pool.
    - cron: '0 7 * * 0'
  workflow_dispatch:
    inputs:
      fuzztime:
        description: 'Duration to fuzz each target (Go duration, e.g. 5m, 30m)'
        required: false
        default: '5m'

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./pkg/gitops/
            target: FuzzValidateRepoURL
          - package: ./pkg/gitops/
            target: FuzzValidateBranchName
          - package: ./pkg/deploy/mcp/helm/
            target: FuzzValidateHelmIdentifier
          - package: ./pkg/deploy/mcp/helm/
            target: FuzzValidateHelmSetKey
          - package: ./pkg/deploy/mcp/helm/
            target: FuzzValidateHelmSetValue
          - package: ./pkg/security/namespace/
            target: FuzzValidateNamespace
          - package: ./pkg/security/sanitize/
            target: FuzzSanitizeControlChars
          - package: ./pkg/security/netguard/
            target: FuzzIsBlockedIP
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run ${{ matrix.target }}
        env:
          FUZZTIME: ${{ github.event.inputs.fuzztime || '5m' }}
          TARGET: ${{ matrix.target }}
          PACKAGE: ${{ matrix.package }}
        run: |
          echo "Fuzzing ${TARGET} in ${PACKAGE} for ${FUZZTIME}"
          # -run=^$ skips normal tests; -fuzz picks a single target.
          go test -run='^$' -fuzz="^${TARGET}\$" -fuzztime="${FUZZTIME}" "${PACKAGE}"

      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashers-${{ matrix.target }}
          path: |
            **/testdata/fuzz/${{ matrix.target }}/**
          if-no-files-found: ignore
          retention-days: 30

  notify:
    needs: [fuzz]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      issues: write
    steps:
      - name: Alert on scheduled-run failure
        if: |
          github.event_name == 'schedule' && needs.fuzz.result == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v8.0.0
        with:
          script: |
            const title = 'Scheduled fuzz run failed';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The scheduled \`fuzz.yml\` run failed for at least one fuzz target.`,
              '',
              `- Run: ${runUrl}`,
              `- fuzz (matrix): ${{ needs.fuzz.result }}`,
              '',
              'This is the only automated check continuously exercising the fuzz targets (gitops, helm, namespace, sanitize, netguard) against new inputs each week; a silent failure means that regression net is down with no one aware.',
              'See runbooks/mcp-server-operations.md "Detecting a Failed Scheduled Workflow" for triage steps.',
            ].join('\n');
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'fuzz-alert',
                color: 'b60205',
                description: 'Auto-filed when a scheduled fuzz.yml run fails (see runbooks/mcp-server-operations.md)',
              });
            } catch (err) {
              if (err.status !== 422) throw err;
            }
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'fuzz-alert',
            });
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['fuzz-alert'],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: `Recurred: ${runUrl}`,
              });
            }

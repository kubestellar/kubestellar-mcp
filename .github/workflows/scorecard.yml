name: OpenSSF Scorecard

on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  security-events: write
  contents: read
  actions: read
  id-token: write

jobs:
  analysis:
    uses: kubestellar/infra/.github/workflows/reusable-scorecard.yml@cfe3dcacb317e67ccf3701c98bc0416a7712cfbf  # main

  notify:
    needs: [analysis]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      issues: write
    steps:
      - name: Alert on scheduled-run failure
        if: |
          github.event_name == 'schedule' &&
          needs.analysis.result == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v8.0.0
        with:
          script: |
            const title = 'Scheduled OpenSSF Scorecard run failed';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The scheduled \`scorecard.yml\` run (${context.payload.schedule || 'cron'}) failed.`,
              '',
              `- Run: ${runUrl}`,
              `- analysis: ${{ needs.analysis.result }}`,
              '',
              'The public Scorecard badge may be stale; do not treat an unchanged score as confirmation of a clean posture until this is re-run.',
              'See runbooks/mcp-server-operations.md "Detecting a Failed Scheduled Workflow" for triage steps.',
            ].join('\n');
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'scorecard-alert',
                color: 'b60205',
                description: 'Auto-filed when a scheduled scorecard.yml run fails (see runbooks/mcp-server-operations.md)',
              });
            } catch (err) {
              if (err.status !== 422) throw err;
            }
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'scorecard-alert',
            });
            if (existing.data.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['scorecard-alert', 'help wanted'],
            });

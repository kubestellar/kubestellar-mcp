name: integration-test

on:
  pull_request:
    paths:
      - 'pkg/**'
      - 'internal/**'
      - 'test/integration/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/integration-test.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install envtest assets
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use -p path 1.30.x)" >> "$GITHUB_ENV"

      - name: Run integration tests
        run: make test-integration

      - name: Summarize integration coverage
        if: always()
        run: |
          if [ ! -f integration-coverage.out ]; then
            {
              echo "## Integration coverage"
              echo ""
              echo "No integration coverage profile was produced."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          COVERAGE=$(go tool cover -func=integration-coverage.out | awk '/^total:/ {print $3}')
          {
            echo "## Integration coverage"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Profile | integration-coverage.out |"
            echo "| Total coverage | ${COVERAGE} |"
            echo ""
            echo "Integration coverage is uploaded as a separate artifact. The unit-test ratchet in build-test.yml remains unit-only so its existing floor semantics do not change."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload integration coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-coverage
          path: integration-coverage.out
          if-no-files-found: ignore

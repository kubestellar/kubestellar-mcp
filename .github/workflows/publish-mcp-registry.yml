name: Publish to MCP Registry

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag whose version should be published (e.g. v0.9.15). Leave empty to publish server.json as committed.'
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Release tag whose version should be published (e.g. v0.9.15)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync server.json version to release tag
        if: inputs.tag != ''
        run: |
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"
          jq --arg v "$VERSION" \
            '.version = $v | .packages[0].identifier = ("ghcr.io/kubestellar/kubestellar-mcp:" + $v)' \
            server.json > server.json.tmp
          mv server.json.tmp server.json
          cat server.json

      - name: Install mcp-publisher
        run: |
          VERSION="v1.8.1"
          EXPECTED_SHA256="a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
          PLATFORM="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          TARBALL="mcp-publisher_${PLATFORM}_${ARCH}.tar.gz"
          
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/download/${VERSION}/${TARBALL}" -o "${TARBALL}"
          echo "${EXPECTED_SHA256}  ${TARBALL}" | sha256sum -c -
          tar xzf "${TARBALL}" mcp-publisher
          rm "${TARBALL}"

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server metadata
        run: ./mcp-publisher publish

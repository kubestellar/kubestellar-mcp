name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily at 06:00 UTC — independent of any code push, to catch
    # environmental drift against SLO 2 (Cluster Discovery Latency) and
    # SLO 4 (Tool-Call Accuracy) per docs/slo.md "Alerting Guidance".
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Check coverage threshold
        run: |
          THRESHOLD=$(cat .github/go-coverage-ratchet.txt)
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
          echo "Total coverage: ${COVERAGE}%  (ratchet: ${THRESHOLD}%)"

          STATUS="pass"
          if awk -v c="$COVERAGE" -v t="$THRESHOLD" 'BEGIN { exit !(c + 0 < t + 0) }'; then
            STATUS="fail"
          fi

          {
            echo "## Coverage report"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Total coverage | ${COVERAGE}% |"
            echo "| Ratchet threshold | ${THRESHOLD}% |"
            echo "| Status | ${STATUS} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$STATUS" = "fail" ]; then
            echo "::error::Coverage ${COVERAGE}% is below ratchet threshold ${THRESHOLD}%"
            echo "::error::Update .github/go-coverage-ratchet.txt if coverage legitimately decreased."
            exit 1
          fi
          # Auto-update ratchet if coverage improved
          if awk -v c="$COVERAGE" -v t="$THRESHOLD" 'BEGIN { exit !(c + 0 > t + 0) }'; then
            echo "Coverage improved to ${COVERAGE}% — update .github/go-coverage-ratchet.txt to lock in gains"
          fi

      - name: Check per-package coverage ratchet
        run: |
          chmod +x scripts/check-go-coverage-ratchet.sh
          ./scripts/check-go-coverage-ratchet.sh \
            coverage.out \
            .github/go-coverage-ratchet.txt \
            .github/go-package-coverage-ratchet.txt

      - name: Run shell tests
        # Auto-discovers scripts/__tests__/*.test.sh (regression suite for
        # the coverage-ratchet helpers this workflow already invokes) and
        # runs each with bash. Any test-file failure aborts the job so a
        # regression to check-go-coverage-ratchet.sh, check-go-package-
        # coverage.sh, or check-go-ratchet-completeness.sh is caught here
        # instead of on a live workflow run.
        run: ./scripts/run_shell_tests.sh

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          fail_ci_if_error: false

  validate-server-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate server.json schema
        run: |
          python3 << 'EOF'
          import json
          import sys

          try:
              with open('server.json', 'r') as f:
                  data = json.load(f)
          except FileNotFoundError:
              print("ERROR: server.json not found")
              sys.exit(1)
          except json.JSONDecodeError as e:
              print(f"ERROR: Invalid JSON syntax: {e}")
              sys.exit(1)

          required_fields = ['name', 'version', 'packages', 'repository']
          missing_fields = [field for field in required_fields if field not in data]

          if missing_fields:
              print(f"ERROR: Missing required fields: {', '.join(missing_fields)}")
              sys.exit(1)

          print("server.json validation passed")
          print(f"  - name: {data['name']}")
          print(f"  - version: {data['version']}")
          print(f"  - packages count: {len(data['packages'])}")
          print(f"  - repository: {data['repository']}")
          EOF

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m

version: "2"

run:
  # Pin the targeted Go language version for linters (govet, paralleltest, etc.)
  # instead of auto-detecting it from go.mod's `go` directive. The CI
  # golangci-lint-action currently pins a golangci-lint build compiled with
  # Go 1.26, which is older than this module's go.mod `go 1.27.2` directive
  # (bumped to pick up stdlib CVE fixes). golangci-lint refuses to run when
  # its own build version is lower than the targeted version, so pin it here
  # to the lint binary's build version until the pinned golangci-lint release
  # is built with Go 1.27+.
  go: "1.26"
